<!DOCTYPE html>
<html>
<head>
<title>Calendar Generator</title>
<style>
body {
    font-family: Arial;
    text-align: center;
    background: #eee;
}
input, button {
    padding: 10px;
    margin: 10px;
}
#calendar {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}
.month {
    background: white;
    padding: 10px;
    border-radius: 8px;
}
table {
    width: 100%;
}
td, th {
    padding: 5px;
}
th {
    color: #cf91b5;
}
</style>
</head>
<body>

<h2>Yearly Calendar</h2>

<input type="number" id="year" placeholder="Enter Year">
<button onclick="generate()">Generate</button>

<p id="error"></p>
<div id="calendar"></div>

<script>
function generate() {
    let y = Number(document.getElementById("year").value);
    let c = document.getElementById("calendar");
    let e = document.getElementById("error");

    c.innerHTML = "";
    e.innerHTML = "";

    if (!Number.isInteger(y) || y < 1000 || y > 9999) {
        e.innerHTML = "Enter a year between 1000 and 9999";
        return;
    }

    let months = ["January","February","March",
    "April","May","June","July","August",
    "September","October","November","December"];

    for (let m = 0; m < 12; m++) {
        let first = new Date(y, m, 1).getDay();
        let total = new Date(y, m + 1, 0).getDate();

        let html = "<div class='month'><h3>" +
        months[m] + " " + y + "</h3><table><tr>";

        let days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

        for (let d of days) html += "<th>" + d + "</th>";

        html += "</tr><tr>";

        for (let i = 0; i < first; i++)
            html += "<td></td>";

        for (let d = 1; d <= total; d++) {
            html += "<td>" + d + "</td>";

            if ((first + d) % 7 == 0 && d != total)
                html += "</tr><tr>";
        }
        html += "</tr></table></div>";
        c.innerHTML += html;
    }
}
</script>
</body>
</html>
